[org/gnome/shell/extensions/copyous]
database-backend='sqlite'
history-length=@SIZE@
history-time=0
remember-search=false
incognito=false
exclude-pinned=false
exclude-tagged=false
show-at-pointer=false
show-at-cursor=false
clipboard-orientation='horizontal'
clipboard-position-horizontal='fill'
clipboard-position-vertical='center'
clipboard-size=1000
auto-hide-search=false
show-scrollbar=true
item-width=250
item-height=170
dynamic-item-height=false

[org/gnome/shell/extensions/copyous/link-item]
show-link-preview=true
show-link-preview-image=false
