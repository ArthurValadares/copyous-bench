# Pre-commit hooks for copyous-bench.
# Install with: uv run pre-commit install
default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Run mypy inside the project's uv-managed environment so it uses the exact
  # dependency versions from uv.lock (numpy/matplotlib ship their own types).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # Enforce the Conventional Commits format on every commit message.
      # Install with: uv run pre-commit install --hook-type commit-msg
      - id: commitizen
        name: commitizen
        entry: uv run --frozen cz check --commit-msg-file
        language: system
        stages: [commit-msg]
