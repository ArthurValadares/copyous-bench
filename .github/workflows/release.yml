name: Release

# Every pushed tag matching `v*` triggers a release. The tag must match the
# version declared in pyproject.toml and src/copyous_bench/__init__.py.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen mypy

      - name: Run tests
        run: uv run --frozen pytest

  release:
    name: Build and publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history and tags are required to compute the changelog range.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Resolve release metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$TAG' is not a release tag (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi

          version="${TAG#v}"
          project_version="$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package_version="$(uv run --frozen python -c 'import copyous_bench; print(copyous_bench.__version__)')"

          if [[ "$version" != "$project_version" ]]; then
            echo "::error::Tag '$TAG' does not match the pyproject.toml version '$project_version'. Run 'uv run cz bump' before tagging."
            exit 1
          fi

          if [[ "$version" != "$package_version" ]]; then
            echo "::error::Tag '$TAG' does not match copyous_bench.__version__ '$package_version'. Run 'uv run cz bump' before tagging."
            exit 1
          fi

          # Commitizen's PEP 440 prereleases look like 1.2.0rc1, 1.2.0a1, 1.2.0.dev1.
          if [[ "$version" == *-* || "$version" =~ (a|b|rc|dev)[0-9]*$ ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $version, prerelease=$prerelease)."

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Build source archive
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --prefix="copyous-bench-${VERSION}/" \
            --output="dist/copyous-bench-${VERSION}.zip" \
            "$TAG"

      - name: Generate changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Commitizen renders only the commits since the previous release tag
          # when the changelog is generated for a single version.
          if ! uv run --frozen cz changelog "$TAG" --dry-run > release-notes.md; then
            echo "::warning::Commitizen could not generate the changelog; falling back to a compare link."
            previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
            {
              echo "## ${TAG}"
              echo
              if [[ -n "$previous" ]]; then
                echo "Full changelog: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
              else
                echo "Full changelog: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${TAG}"
              fi
            } > release-notes.md
          fi

          if [[ ! -s release-notes.md ]]; then
            echo "## ${TAG}" > release-notes.md
          fi

          echo "----- release notes -----"
          cat release-notes.md

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.whl ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Re-runs update the existing release instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            edit_args=(--title "$TAG" --notes-file release-notes.md)
            if [[ "$PRERELEASE" == "true" ]]; then
              edit_args+=(--prerelease)
            fi
            gh release edit "$TAG" "${edit_args[@]}"
            gh release upload "$TAG" dist/* --clobber
          else
            create_args=(--verify-tag --title "$TAG" --notes-file release-notes.md)
            if [[ "$PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "$TAG" "${create_args[@]}" dist/*
          fi
